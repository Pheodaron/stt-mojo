[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "nemotron-diarization-max"
version = "0.1.0"
description = "Nemotron 3 speaker diarization on Modular MAX (CPU, float32)"
requires-python = ">=3.12,<3.14"
dependencies = [
  "modular==26.7.0", "numpy>=2.2,<3", "scipy>=1.15,<2",
  "safetensors>=0.6,<1", "huggingface-hub>=1,<2",
  "starlette>=0.49,<2", "uvicorn>=0.30,<1", "anyio>=4.8,<5",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.28"]
reference = [
  "torch>=2.9", "librosa>=0.11",
  "transformers @ https://github.com/huggingface/transformers/archive/420dca92a4cf7d96dfbc1cc46f00375b0681ff8f.tar.gz",
]

[project.scripts]
nemotron-max = "nemotron_diarization_max.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["reference: numerical comparison with upstream PyTorch", "full: full 31-layer CPU validation"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
